name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for release (e.g., v1.1) - only for manual dispatch, must also create tag locally if you want it pushed"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Fail fast if secrets missing (GITHUB_TOKEN is automatic, no need to expose)
          if [ -z "${KEYSTORE_BASE64:-}" ]; then echo "Missing KEYSTORE_BASE64 secret"; exit 1; fi
          # Decode without echoing content
          echo "$KEYSTORE_BASE64" | base64 --decode > release-key.jks
          # Create keystore.properties without logging passwords (mask)
          echo "KEYSTORE_PATH=release-key.jks" > keystore.properties
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> keystore.properties
          echo "KEY_ALIAS=$KEY_ALIAS" >> keystore.properties
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> keystore.properties
          # Restrict perms
          chmod 600 release-key.jks keystore.properties
          echo "Keystore prepared (not logged)."

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Get tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean secrets from workspace
        if: always()
        run: |
          shred -u release-key.jks keystore.properties 2>/dev/null || rm -f release-key.jks keystore.properties
